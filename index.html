<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
</head>
<body>

    <h2>Formulario de Contacto</h2>

    <form>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" required>
        <br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required>
        <br><br>

        <!-- Botón normal, NO es submit -->
        <button type="button" onclick="enviarDatos()">Enviar</button>
    </form>

    <hr>

    <!-- Aquí aparecerá el mensaje y los datos -->
    <div id="mensaje"></div>


    <script>
        function enviarDatos() {
            // Obtener lo que escribió el usuario
            let nombre = document.getElementById("nombre").value;
            let apellido = document.getElementById("apellido").value;
            let telefono = document.getElementById("telefono").value;

            // Mostrar mensaje de confirmación y los datos
            document.getElementById("mensaje").innerHTML = 
                "<h3 style='color: green;'>✅ ¡Datos recibidos correctamente!</h3>" +
                "<p><strong>Nombre:</strong> " + nombre + "</p>" +
                "<p><strong>Apellido:</strong> " + apellido + "</p>" +
                "<p><strong>Teléfono:</strong> " + telefono + "</p>";
        }
    </script>

</body>
</html>
