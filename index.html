<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
</head>
<body>

    <h2>Formulario de Contacto</h2>

    <!-- Quitamos todo lo que pueda causar envío -->
    <form>
        
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br><br>

        <label for="apellido">Apellido:</label>
        <input type="text" id="apellido" name="apellido" required>
        <br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required>
        <br><br>

        <!-- Cambiamos el botón para que sea normal y use onclick -->
        <button type="button" onclick="mostrarDatos()">Enviar</button>
    </form>

    <hr>

    <h3>Datos Adquiridos:</h3>
    <p id="resultado"></p>


    <script>
        function mostrarDatos() {
            // Ya no necesitamos event.preventDefault() porque no se envía el formulario

            // Obtener los valores
            let nombre = document.getElementById("nombre").value;
            let apellido = document.getElementById("apellido").value;
            let telefono = document.getElementById("telefono").value;

            // Mostrar el resultado
            document.getElementById("resultado").innerHTML = 
                "Nombre: " + nombre + "<br>" +
                "Apellido: " + apellido + "<br>" +
                "Teléfono: " + telefono;
        }
    </script>

</body>
</html>
